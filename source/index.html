<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工時V2.0</title><style>
:root{color-scheme:light;--green:#19674f;--ink:#213d33;--muted:#7c8e84}*{box-sizing:border-box}body{margin:0;background:#f4f7f3;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}header{background:#183e32;color:#fff;padding:20px max(22px,calc((100% - 580px)/2));display:flex;align-items:center;gap:10px}header strong{font-size:19px;letter-spacing:2px}.mark{width:33px;height:33px;background:#d8e9ba;color:#355c40;border-radius:10px;text-align:center;font-size:22px}.pill{margin-left:auto;font-size:11px;color:#d9e8c8;border:1px solid #688773;border-radius:20px;padding:3px 10px;white-space:nowrap}main{max-width:560px;margin:35px auto;padding:0 20px 30px}.eyebrow{font-size:10px;color:#839c8a;letter-spacing:2.5px}h1{font-size:29px;letter-spacing:1px;margin:9px 0 6px}p{margin:0}.intro{color:var(--muted);font-size:13px}.card{background:white;border:1px solid #e1e9df;border-radius:20px;padding:27px;margin-top:25px;box-shadow:0 7px 26px #24442d05}label,.label{display:block;font-size:13px;font-weight:600;margin-bottom:9px}input,select,button{font:inherit}input,select{width:100%;min-width:0;min-height:47px;padding:10px 12px;color:var(--ink);background:white;border:1px solid #dbe4dc;border-radius:9px;font-size:16px}input:focus,select:focus{outline:3px solid #dfefe3;border-color:#6f9e82}input[type=date]{display:block;width:100%;appearance:none;-webkit-appearance:none}input[type=date]::-webkit-date-and-time-value{text-align:left}.balance{background:#eff5e7;border:1px solid #e4ecd8;border-radius:12px;padding:17px 20px;margin:15px 0 24px;display:flex;align-items:center;justify-content:space-between}.balance p{font-size:12px;color:#789365}.balance strong{font-size:44px;font-weight:600;letter-spacing:-1px;color:#547b3e}.balance small{font-size:13px;color:#8fa27d;margin-left:8px}.clock{font-size:32px;color:#a0b582}.field{margin-top:22px}.optional{font-weight:400;color:#9aa792;font-size:11px;margin-left:6px}.hint{color:#8b9a83;font-size:11px;line-height:1.8;margin-top:7px}.weeks{display:grid;grid-template-columns:minmax(0,1fr) 125px;gap:10px}.summary{margin-top:10px;border-radius:8px;background:#f7faf3;padding:10px;font-size:12px;color:#668359}.summary button{border:0;background:none;text-decoration:underline;color:#668359;padding:3px 0;cursor:pointer;font-size:11px;display:block}.hours{display:flex;border:1px solid #dbe4dc;border-radius:9px;overflow:hidden}.hours input{border:0;min-width:0;text-align:right;font-size:25px}.hours span{align-self:center;font-size:12px;color:#93a18a;padding:0 18px 0 3px}.quick{display:flex;gap:8px;margin-top:10px}.quick button{background:#f6f9f0;border:1px solid #e2ead6;border-radius:7px;font-size:12px;color:#7b9469;padding:6px 14px;cursor:pointer}.submit{width:100%;margin-top:27px;min-height:53px;background:var(--green);color:white;border:0;border-radius:10px;font-weight:600;cursor:pointer}.submit:disabled{opacity:.5;cursor:not-allowed}.submit:focus-visible,button:focus-visible{outline:3px solid #9bc4aa;outline-offset:3px}.foot{text-align:center;font-size:10px;color:#96a38c;margin-top:13px}.notice{font-size:12px;border-radius:10px;padding:13px 15px;margin-top:18px;line-height:1.9}.notice.error{background:#fff4e5;color:#986627;border:1px solid #f1dbb9}.notice.success{background:#edf6ec;color:#487742;border:1px solid #d6e8ce}.notice[hidden]{display:none}footer{padding:24px 5px 0;text-align:center;color:#96a18f;font-size:11px}select:disabled{background:#f6f8f3;color:#99a68f}@media(max-width:400px){.card{padding:22px}main{padding-inline:15px}.weeks{grid-template-columns:minmax(0,1fr) 114px}h1{font-size:26px}}
.date-period{border:0;padding:0;min-width:0;margin-inline:0}.date-period legend{font-size:13px;font-weight:600;margin-bottom:9px;padding:0}.dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.dates>div{min-width:0}.dates label{font-size:12px;color:#7c8e84;font-weight:400}.hours button{flex-shrink:0;width:44px;min-height:49px;border:0;background:#f6f9f2;color:#6c8e5b;font-size:24px;cursor:pointer}.hours button:disabled{opacity:.35;cursor:default}.hours span{padding-right:10px}.card{margin-top:0}main{margin-top:24px}@media(max-width:360px){.dates{grid-template-columns:minmax(0,1fr)}}
.normal-hours-notice{border:1px solid #ead9b8;background:#fff6e6;color:#906222;border-radius:10px;padding:13px 15px;margin:-7px 0 23px;font-size:13px;line-height:1.9}.normal-hours-notice[hidden]{display:none}
</style></head><body><header><span class="mark">◷</span><strong>工時V2.0</strong><span class="pill">人員掛列</span></header><main><section class="card"><form id="form"><label for="job">可掛列工編</label><select id="job" required disabled><option>正在讀取工編…</option></select><div class="balance"><div><p>這個工編目前可用</p><strong id="remaining">—</strong><small>小時</small></div><span class="clock" aria-hidden="true">◷</span></div><div id="normal-hours-notice" class="normal-hours-notice" role="status" hidden></div><div class="field"><label for="person">掛列人員</label><input id="person" autocomplete="name" placeholder="姓名或員工編號" maxlength="60" required></div><fieldset class="field date-period"><legend>掛列區間<span class="optional">選填</span></legend><div class="dates"><div><label for="period-start">起日</label><input id="period-start" type="date" min="2000-01-01" max="2100-12-31"></div><div><label for="period-end">迄日</label><input id="period-end" type="date" min="2000-01-01" max="2100-12-31"></div></div><p class="hint">可自由選擇起迄日，不限週數；留空也可送出。</p><div id="period" class="summary" aria-live="polite">未選擇區間，可直接送出。</div></fieldset><div class="field"><label for="hours">使用時數</label><div class="hours"><button type="button" id="minus-hours" aria-label="減少一小時">−</button><input id="hours" type="number" inputmode="decimal" min="0.25" max="1000000" step="0.25" value="8" required><span>小時</span><button type="button" id="plus-hours" aria-label="增加一小時">＋</button></div><div class="quick"><button type="button" data-hours="2">2 小時</button><button type="button" data-hours="4">4 小時</button><button type="button" data-hours="8">8 小時</button></div><p class="hint">最小單位為 0.25 小時；已扣除預留工時，超過可用額度會整筆攔截。</p></div><div id="message" class="notice" role="status" hidden></div><button class="submit" id="submit" disabled>確認送出掛列 →</button><p class="foot">送出成功才扣抵額度・掛列時間由系統自動記錄</p></form></section><footer id="sync-status" aria-live="polite">正在同步工時…</footer></main><script>
const API_ORIGIN='https://hourledger-1027.mytming66888.chatgpt.site';
const $=id=>document.getElementById(id);
const number=n=>new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2}).format(n);
const read=(store,key)=>{try{return store.getItem(key)}catch{return null}};
const save=(store,key,value)=>{try{value===null?store.removeItem(key):store.setItem(key,value)}catch{}};
let jobs=[],pending=null,sending=false,syncError=true;
try{$('person').value=read(localStorage,'hourledger-name')||read(localStorage,'staff-trial-name')||'';pending=JSON.parse(read(sessionStorage,'hourledger-v2-pending')||'null')}catch{}
function range(){return {periodStart:$('period-start').value||null,periodEnd:$('period-end').value||null}}
function showRange(){const r=range(),start=$('period-start'),end=$('period-end');start.required=Boolean(r.periodEnd);end.required=Boolean(r.periodStart);end.setCustomValidity(r.periodStart&&r.periodEnd&&r.periodEnd<r.periodStart?'迄日不得早於起日。':'');$('period').replaceChildren();if(!r.periodStart&&!r.periodEnd){$('period').textContent='未選擇區間，可直接送出。';return}if(r.periodStart&&r.periodEnd){const days=(Date.parse(r.periodEnd+'T00:00:00Z')-Date.parse(r.periodStart+'T00:00:00Z'))/86400000+1;$('period').textContent=days>0?r.periodStart.replaceAll('-','/')+' ～ '+r.periodEnd.replaceAll('-','/')+'（共 '+days+' 天）':'迄日不得早於起日。'}else{$('period').textContent='請完整選擇起日與迄日。'}const clear=document.createElement('button');clear.type='button';clear.textContent='清除區間';clear.onclick=()=>{start.value='';end.value='';showRange()};$('period').append(clear)}
$('period-start').onchange=showRange;$('period-end').onchange=showRange;
function updateHoursButtons(){$('minus-hours').disabled=Number($('hours').value)<=0.25;$('plus-hours').disabled=Number($('hours').value)>=1000000}
function changeHours(delta){const value=Number($('hours').value)||0;$('hours').value=Math.max(0.25,Math.min(1000000,Math.round((value+delta)*4)/4));updateHoursButtons()}
$('minus-hours').onclick=()=>changeHours(-1);$('plus-hours').onclick=()=>changeHours(1);$('hours').oninput=updateHoursButtons;
document.querySelectorAll('[data-hours]').forEach(button=>button.onclick=()=>{$('hours').value=button.dataset.hours;updateHoursButtons()});updateHoursButtons();
function message(text,success=false){$('message').hidden=false;$('message').className='notice '+(success?'success':'error');$('message').textContent=text}
function currentJob(){return jobs.find(job=>job.id===$('job').value)}
function availableMinutes(job){return job?Math.max(0,Number.isFinite(job.availableMinutes)?job.availableMinutes:job.totalMinutes-job.usedMinutes-(job.reservedMinutes||0)):0}
function normalHoursOnly(job){const remaining=availableMinutes(job);return Boolean(job&&job.enabled&&!job.closed&&job.deletedAt==null&&remaining>0&&remaining<=16*60)}
function updateSelection(){const job=currentJob();const normal=normalHoursOnly(job);$('normal-hours-notice').hidden=!normal;$('normal-hours-notice').textContent=normal?'此工編可用 '+number(availableMinutes(job)/60)+' 小時，僅可掛列正常工時。':'';$('remaining').textContent=job?number(availableMinutes(job)/60):'—';$('submit').disabled=sending||syncError||!job;$('submit').textContent=sending?'正在確認額度…':!jobs.length?'目前無可掛列工編':!job?'請先選擇工編':'確認送出掛列 →'}
$('job').onchange=()=>{updateSelection();$('message').hidden=true};
async function api(path,payload){const response=await fetch(API_ORIGIN+'/api/'+path,{method:payload?'POST':'GET',credentials:'omit',cache:'no-store',headers:payload?{'Content-Type':'application/json'}:undefined,body:payload?JSON.stringify(payload):undefined});const data=await response.json();if(!response.ok)throw new Error(data.error||'目前無法完成操作，請稍後再試。');return data}
async function refresh(){try{const data=await api('snapshot');if(!Array.isArray(data.jobs))throw new Error('工時資料格式錯誤，請稍後再試。');const selected=$('job').value;jobs=data.jobs.filter(job=>job.enabled&&!job.closed&&job.deletedAt==null&&availableMinutes(job)>0);const placeholder=new Option(jobs.length?'請選擇工編':'目前無可掛列工編','');placeholder.disabled=true;$('job').replaceChildren(placeholder);for(const job of jobs)$('job').append(new Option(job.code+' · '+job.title+(normalHoursOnly(job)&&job.title!=='僅可掛列正常工時'?' · 僅可掛列正常工時':'')+' · 可用 '+number(availableMinutes(job)/60)+' 小時',job.id));$('job').value=jobs.some(job=>job.id===selected)?selected:!selected&&jobs.length===1?jobs[0].id:'';$('job').disabled=!jobs.length||sending;syncError=false;$('sync-status').textContent='工時已同步 · 台灣時間 '+new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(data.serverTime||Date.now()))}catch(error){syncError=true;$('sync-status').textContent='連線暫停，請稍後再試。';throw error}finally{updateSelection()}}
$('form').onsubmit=async event=>{event.preventDefault();if(sending||!currentJob())return;const job=currentJob();sending=true;$('job').disabled=true;updateSelection();try{const payload={jobId:job.id,person:$('person').value.trim(),...range(),hours:Number($('hours').value),note:'',website:''};const fingerprint=JSON.stringify(payload);if(!pending||pending.fingerprint!==fingerprint)pending={fingerprint,id:crypto.randomUUID()};save(sessionStorage,'hourledger-v2-pending',JSON.stringify(pending));const data=await api('bookings',{...payload,requestId:pending.id});pending=null;save(sessionStorage,'hourledger-v2-pending',null);save(localStorage,'hourledger-name',payload.person);message('掛列成功！工編 '+job.code+'，本次 '+number(payload.hours)+' 小時。掛列時間：'+new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',dateStyle:'short',timeStyle:'medium',hour12:false}).format(new Date(data.createdAt))+'（台灣時間）',true)}catch(error){message(error instanceof TypeError?'連線中斷，尚未確認結果。請再次送出以確認同一筆紀錄。':error.message)}finally{sending=false;await refresh().catch(()=>{});$('job').disabled=!jobs.length;updateSelection()}};
refresh().catch(error=>message(error.message));setInterval(()=>{if(!document.hidden&&!sending)refresh().catch(()=>{})},20000);window.addEventListener('focus',()=>{if(!sending)refresh().catch(()=>{})});
</script></body></html>
